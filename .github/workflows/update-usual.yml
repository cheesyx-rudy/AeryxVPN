name: Update usual subscription

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Update mode"
        required: true
        default: fresh
        type: choice
        options:
          - fresh
          - cleanup
  schedule:
    - cron: "30 * * * *"

permissions:
  contents: write

concurrency:
  group: usual-sub-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build proxy URL list
        working-directory: usual-sub/legacy
        env:
          UPDATE_MODE: ${{ github.event_name == 'schedule' && 'fresh' || inputs.mode }}
        run: |
          set -euo pipefail
          python proxy_parser.py --mode "$UPDATE_MODE"

      - name: Commit generated files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usual-sub/legacy/proxies.txt usual-sub/legacy/parsed_proxies.txt usual-sub/legacy/routing/LIKVID-RU-WHITELIST.JSON usual-sub/legacy/routing/LIKVID-RU-WHITELIST.DEEPLINK
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          if [ "${{ github.event_name == 'schedule' && 'fresh' || inputs.mode }}" = "cleanup" ]; then
            git commit -m "Remove failed proxy URLs"
          else
            git commit -m "Update proxy URLs"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
