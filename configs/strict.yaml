pipeline:
  name: likvid-strict-subscription
  fail_on_empty: true
  min_output_configs: 5
  min_output_ratio: 0.03
sources:
  type: url_list
  path: usual-sub/legacy/proxy_sources.txt
  max_source_bytes: 20971520
  fetch_timeout_seconds: 30
stages:
  - name: collect
    enabled: true
  - name: filter_unsupported
    enabled: true
    skip_mlkem: true
  - name: normalize
    enabled: true
  - name: deduplicate
    enabled: true
    identity: uri_without_fragment
  - name: cluster_analysis
    enabled: true
    group_by: scheme_host_port_transport_security
    warn_after: 3
  - name: blocklist_filter
    enabled: true
    url_env: LIKVID_BLOCKLIST_URL
    cache_path: usual-sub/legacy/blocklist_cache.txt
    timeout_seconds: 20
  - name: xray_probe
    enabled: true
    core: xray
    mode: proxy_get
    request_mode: keepalive
    test_url: https://www.gstatic.com/generate_204
    accepted_status_codes: [204]
    timeout_seconds: 8
    attempts: 2
    retry_delay_seconds: 0.5
    workers: 8
    reject_unsupported_protocols: true
  - name: stability_check
    enabled: true
    require_all_attempts_passed: true
outputs:
  working: usual-sub/legacy/parsed_proxies.txt
  rejected: usual-sub/legacy/rejected_proxies.txt
  report: usual-sub/legacy/validation_report.json
  subscription: usual-sub/legacy/proxies.txt
  max_configs: 1000
